[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Redirect lien externe cassé — Google crawlait https://onmangequoi.eu/5) (404 depuis 06/2023)
[[redirects]]
  from = "/5)"
  to = "/"
  status = 301

# Phase 2E : about.html supprime (21/05/2026), redirects vers score-sante.html
[[redirects]]
  from = "/about"
  to = "/score-sante.html"
  status = 301
[[redirects]]
  from = "/about.html"
  to = "/score-sante.html"
  status = 301

# Canonicalisation : URLs sans .html -> URL avec .html
# Sans ces regles, Netlify resout le .html automatiquement et sert le meme contenu
# pour les 2 URLs, ce qui cree un duplicate aux yeux de Google. Trouve via Search
# Console (26/08/2026) : /recettes atterrissait en "crawled, not indexed" au lieu
# d'etre proprement redirige comme /score-sante l'etait deja.
[[redirects]]
  from = "/score-sante"
  to = "/score-sante.html"
  status = 301
  force = true
[[redirects]]
  from = "/recettes"
  to = "/recettes.html"
  status = 301
  force = true
[[redirects]]
  from = "/fiche"
  to = "/fiche.html"
  status = 301
  force = true
[[redirects]]
  from = "/courses"
  to = "/courses.html"
  status = 301
  force = true
[[redirects]]
  from = "/semaine"
  to = "/semaine.html"
  status = 301
  force = true
[[redirects]]
  from = "/mentions-legales"
  to = "/mentions-legales.html"
  status = 301
  force = true
[[redirects]]
  from = "/politique-confidentialite"
  to = "/politique-confidentialite.html"
  status = 301
  force = true
[[redirects]]
  from = "/blog/faq"
  to = "/blog/faq.html"
  status = 301
  force = true
[[redirects]]
  from = "/blog/cadmium-alimentation"
  to = "/blog/cadmium-alimentation.html"
  status = 301
  force = true
[[redirects]]
  from = "/blog/mercure-poissons"
  to = "/blog/mercure-poissons.html"
  status = 301
  force = true
[[redirects]]
  from = "/blog/pesticides-fruits-legumes"
  to = "/blog/pesticides-fruits-legumes.html"
  status = 301
  force = true
[[redirects]]
  from = "/blog/planificateur-repas-familial-anses-efsa"
  to = "/blog/planificateur-repas-familial-anses-efsa.html"
  status = 301
  force = true
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# JS et JSON : pas de cache long pour voir les mises à jour immédiatement
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Sitemap : Content-Type explicite pour que Google puisse le lire
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
