[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Redirect lien externe cassé — Google crawlait https://onmangequoi.eu/5) (404 depuis 06/2023)
[[redirects]]
  from = "/5)"
  to = "/"
  status = 301

# Phase 2E : about.html supprime (21/05/2026), redirects vers score-sante.html
[[redirects]]
  from = "/about"
  to = "/score-sante.html"
  status = 301
[[redirects]]
  from = "/about.html"
  to = "/score-sante.html"
  status = 301

# Canonicalisation : /score-sante (sans .html) -> /score-sante.html
# Sans cette regle, Netlify resolve le .html automatiquement et sert le meme contenu
# pour les 2 URLs, ce qui cree un duplicate aux yeux de Google.
[[redirects]]
  from = "/score-sante"
  to = "/score-sante.html"
  status = 301
  force = true

# JS et JSON : pas de cache long pour voir les mises à jour immédiatement
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Sitemap : Content-Type explicite pour que Google puisse le lire
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
