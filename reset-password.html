<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réinitialiser votre mot de passe — On mange quoi ?</title>
  <meta name="description" content="Définissez un nouveau mot de passe pour votre compte On mange quoi ?">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='none' stroke='%231B4332' stroke-width='8'/><circle cx='50' cy='50' r='24' fill='none' stroke='%231B4332' stroke-width='7'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="landing-header">
    <div style="display:flex;align-items:center;gap:32px;">
      <a class="brand--landing" href="/" aria-label="On mange quoi ? — accueil">
        <span class="brand-mark--landing" aria-hidden="true"></span>
        on mange quoi<span style="color:var(--green-800)">?</span>
      </a>
    </div>
  </header>

  <main class="preferences-page" id="main">
    <section class="preferences-hero">
      <span class="preferences-hero__eyebrow">Mot de passe</span>
      <h1 class="preferences-hero__title">Nouveau mot de passe</h1>
      <p class="preferences-hero__intro">Définissez un nouveau mot de passe pour vous reconnecter à votre compte.</p>
    </section>

    <section class="preferences-content">
      <div class="preferences-card">
        <form class="auth-modal__box" id="reset-form" novalidate style="box-shadow:none;padding:0;max-width:none;">
          <input type="password" id="reset-password" class="auth-modal__input" placeholder="Nouveau mot de passe (min. 6 caractères)" autocomplete="new-password" required minlength="6">
          <input type="password" id="reset-password-confirm" class="auth-modal__input" placeholder="Confirmez le mot de passe" autocomplete="new-password" required minlength="6">
          <button type="submit" id="btn-reset" class="auth-modal__btn">Mettre à jour</button>
          <p class="auth-modal__footer" id="reset-status"></p>
        </form>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (function() {
      const SUPABASE_URL  = 'https://pozhsrnsezklfyqjoues.supabase.co';
      const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBvemhzcm5zZXprbGZ5cWpvdWVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxMjgxNTQsImV4cCI6MjA5MDcwNDE1NH0.xdP-8jZju7TN3wALuOb8U-lsfZDpxCv3VDhYLX0qfmw';
      if (window.supabase && window.supabase.createClient && !window.supabaseClient) {
        window.supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
      }
    })();
  </script>
  <script src="auth.js"></script>
  <script>
    // Supabase parse automatiquement le token de l'URL (hash # contenant
    // l'access_token et type=recovery) au chargement du SDK. On vérifie
    // qu'on a bien une session de récupération avant d'autoriser le
    // changement de mot de passe.
    document.addEventListener('submit', async (e) => {
      if (e.target.id !== 'reset-form') return;
      e.preventDefault();

      const pw1 = document.getElementById('reset-password').value;
      const pw2 = document.getElementById('reset-password-confirm').value;
      const btn = document.getElementById('btn-reset');
      const status = document.getElementById('reset-status');

      if (pw1.length < 6) {
        if (typeof showToast === 'function') showToast('Mot de passe trop court', 'Minimum 6 caractères.', 'error');
        return;
      }
      if (pw1 !== pw2) {
        if (typeof showToast === 'function') showToast('Mots de passe différents', 'Les deux saisies doivent correspondre.', 'error');
        return;
      }
      if (!window.supabaseClient || !window.supabaseClient.auth) {
        if (typeof showToast === 'function') showToast('Erreur', 'Service indisponible. Rechargez la page.', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Mise à jour…';
      try {
        const { error } = await window.supabaseClient.auth.updateUser({ password: pw1 });
        if (error) {
          if (typeof showToast === 'function') showToast('Erreur', error.message || 'Mise à jour impossible', 'error');
          if (status) status.textContent = 'Le lien est peut-être expiré. Demandez un nouvel email.';
          return;
        }
        if (typeof showToast === 'function') showToast('Mot de passe mis à jour', 'Vous allez être redirigé vers la connexion.', 'success');
        setTimeout(() => { window.location.href = '/?login=1'; }, 1500);
      } catch (err) {
        if (typeof showToast === 'function') showToast('Erreur', err.message || 'Mise à jour impossible', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Mettre à jour';
      }
    });
  </script>
</body>
</html>
